# Full coupled system with a two-way flood: the box river is handed over by routing and returned to it; floodplain infiltration enters VIC's soil next to irrigation.
# ISC domain (112,825 cells, 1/16 degree, India), one year (2004), VIC 5.1.0.
#   torchvic validate --config configs/full_coupled_system_2way.yaml
#   torchvic run --config configs/full_coupled_system_2way.yaml --out results_full_coupled_system_2way
# Environment (data are not in the package):
#   TORCHVIC_GLOBAL      ISC global file (benchmarks/isc/isc_vic5_3h.txt with
#                        RESULT_DIR / dates filled; `run_combos.py global`)
#   TORCHVIC_FDIR        flow map, FILE.nc:fdir (<data root>/static/isc_fdir.nc)
#   TORCHVIC_DOMAIN      domain.nc (lat, lon, mask, area, frac, elev)
#   TORCHVIC_GAUGES      gauges csv (lat, lng)
#   TORCHVIC_DAMS        dam table (`run_combos.py prepare`)
#   TORCHVIC_COMBO_DATA  inputs from `run_combos.py prepare`
#   TORCHVIC_ALL_DATA    <data root> (flood basin)
#   TORCHVIC_CROP_PARAMS configs/crop_params_sbarley.json
# TORCHVIC_GLOBAL here is benchmarks/isc/isc_vic5_3h_eb.txt (FULL_ENERGY:
# the crop needs VIC's potential evaporation, OUT_PET, an energy-balance
# output).
# Irrigation river/reservoir sources are stub stores; groundwater is
# wired (pumping). Crop is one spring barley set for all cells
# (synthetic). Quality loads/meteorology are synthetic constants.
# Two-way flood (docs/connectors/flood.md): routing hands the
# river over at the entry sites (flood.river_request ->
# routing.withdrawal_request, routing.withdrawn -> flood.inflow) and gets
# the west-edge outflow back at the exit site (flood.returned ->
# routing.injection, lag 1). Floodplain infiltration (10 mm/day,
# SYNTHETIC) -> vic.soil_add_flood next to irrigation -> vic.soil_add_irrigation:
# VIC adds their sum once (cap) and hands the unmet back split in
# proportion to what each added (soil_add_unmet_irrigation,
# soil_add_unmet_flood), so nothing is handed back twice.
version: 1
run: {device: auto, dtype: float64}
modules:
  vic:
    connector: vic
    global_param: ${TORCHVIC_GLOBAL}
    core: 5.1.0
    window_days: 1
    exchange: day
    soil_add_mode: cap
    soil_add_sources: [irrigation, flood]
  irrigation:
    connector: irrigation
    vic: &id001 {global_param: '${TORCHVIC_GLOBAL}', core: 5.1.0}
    irrigated_fraction: {file: '${TORCHVIC_COMBO_DATA}/isc_irrigation.nc', var: irr_frac}
    gw_fraction: {file: '${TORCHVIC_COMBO_DATA}/isc_irrigation.nc', var: gw_frac}
    efficiency: 0.7
    conveyance_loss: 0.1
    allocation: priority
    loss_return: river
    groundwater: true
  crop:
    connector: crop
    vic: *id001
    params_file: ${TORCHVIC_CROP_PARAMS}
    start_day: 60
  groundwater:
    connector: groundwater
    global_param: ${TORCHVIC_GLOBAL}
    interval_days: 1
    aquifer:
      k: 5.0
      sy: 0.1
      ss: 1.0e-05
      thickness: 100.0
      top: {file: '${TORCHVIC_DOMAIN}', var: elev}
      depth_to_water: 10.0
    drain: {depth: 3.0}
    pumping: true
    afr: 0.1
  reservoir: {connector: reservoir, dams: '${TORCHVIC_DAMS}', routing: routing, start_date: '2004-01-01',
    relax_steps: 10, evap_m: 0.004}
  quality:
    connector: quality
    routing: routing
    constituents: {nitrate: 2.0e-07, tracer: 0.0}
    temperature: {depth: 1.0, k_ref: 30.0}
    loads: {nitrate: 3.0, tracer: 1.5}
    met: {t_air: 12.0, vp: 0.9, wind: 2.0, sw: 180.0}
    t_runoff: 4.0
  routing:
    connector: routing
    fdir: ${TORCHVIC_FDIR}
    domain: ${TORCHVIC_DOMAIN}
    gauges: ${TORCHVIC_COMBO_DATA}/gauges_flood.csv
    step_s: 86400
    reservoirs: reservoir
    quality: quality
    site_cells: [58492, 63409, 57604, 57587]
  split: {connector: split, cells: '${TORCHVIC_COMBO_DATA}/box_cells.csv', domain: '${TORCHVIC_DOMAIN}'}
  flood:
    connector: flood
    basin: ${TORCHVIC_ALL_DATA}/static/flood_basins/brahmaputra_guwahati_100m.npz
    interval_s: 86400
    free_edges:
    - [W, 0.0001]
    inflow_points:
    - [720, 992]
    - [721, 992]
