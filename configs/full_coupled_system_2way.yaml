connections:
- {from: vic.soil_moisture, to: irrigation.soil_moisture}
- {from: vic.soil_add_unmet_irrigation, to: irrigation.soil_unmet}
- {from: irrigation.soil_add, to: vic.soil_add_irrigation, lag: 1}
- {from: vic.transp, to: crop.transp}
- {from: vic.pet, to: crop.pet}
- {from: crop.crop_active, to: irrigation.season}
- {from: crop.root_depth, to: irrigation.root_depth}
- {from: vic.baseflow, to: groundwater.recharge}
- {from: irrigation.gw_request, to: groundwater.pumping_request}
- {from: groundwater.pumping, to: irrigation.gw_pumped, lag: 1}
- {from: vic.runoff, to: split.runoff}
- {from: split.routed, to: routing.inflow}
- {from: groundwater.discharge, to: routing.inflow}
- {from: split.box, to: flood.runoff, mapping: vic_to_flood}
- {from: flood.river_request, to: routing.withdrawal_request, lag: 1, mapping: pt_site}
- {from: routing.withdrawn, to: flood.inflow, mapping: site_pt}
- {from: flood.returned, to: routing.injection, lag: 1, mapping: out_site}
- {from: flood.infiltration, to: vic.soil_add_flood, lag: 1, mapping: fv2v}
- {from: vic.soil_add_unmet_flood, to: flood.infiltration_unmet, mapping: v2fv}
