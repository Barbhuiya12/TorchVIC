connections:
- {from: vic.total_runoff, to: split.runoff}
- {from: split.routed, to: routing.inflow}
- {from: split.box, to: flood.runoff, mapping: vic_to_flood}
- {from: routing.discharge, to: flood.upstream_discharge}
mappings:
  vic_to_flood: {source: box_cells, target: flood_cells, file: '${TORCHVIC_ALL_DATA}/static/flood_basins/brahmaputra_guwahati_100m_vic_pairs.csv'}
ledger: {enabled: true, on_violation: reject}
output: {dir: results_vic_flood, history: true, ledger: true}
