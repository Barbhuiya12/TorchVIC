# VIC + irrigation + groundwater (pumping).
# ISC domain (112,825 cells, 1/16 degree, India), one year (2004), VIC 5.1.0.
#   torchvic validate --config configs/vic_groundwater_irrigation.yaml
#   torchvic run --config configs/vic_groundwater_irrigation.yaml --out results_vic_groundwater_irrigation
# Environment (data are not in the package):
#   TORCHVIC_GLOBAL      ISC global file (benchmarks/isc/isc_vic5_3h.txt with
#                        RESULT_DIR / dates filled; `run_combos.py global`)
#   TORCHVIC_FDIR        flow map, FILE.nc:fdir (<data root>/static/isc_fdir.nc)
#   TORCHVIC_DOMAIN      domain.nc (lat, lon, mask, area, frac, elev)
#   TORCHVIC_GAUGES      gauges csv (lat, lng)
#   TORCHVIC_DAMS        dam table (`run_combos.py prepare`)
#   TORCHVIC_COMBO_DATA  inputs from `run_combos.py prepare`
#   TORCHVIC_ALL_DATA    <data root> (flood basin)
#   TORCHVIC_CROP_PARAMS configs/crop_params_sbarley.json
# Pumping loop: irrigation.gw_request -> groundwater.pumping_request;
# groundwater.pumping -> irrigation.gw_pumped (lag 1). Aquifer
# parameters are SYNTHETIC (uniform k, sy, thickness).
version: 1
run: {device: auto, dtype: float64}
modules:
  vic: {connector: vic, global_param: '${TORCHVIC_GLOBAL}', core: 5.1.0, snow_bands: mean, window_days: 1,
    exchange: day, soil_add_mode: cap}
  irrigation:
    connector: irrigation
    vic: {global_param: '${TORCHVIC_GLOBAL}', core: 5.1.0, snow_bands: mean}
    irrigated_fraction: {file: '${TORCHVIC_COMBO_DATA}/isc_irrigation.nc', var: irr_frac}
    gw_fraction: {file: '${TORCHVIC_COMBO_DATA}/isc_irrigation.nc', var: gw_frac}
    efficiency: 0.7
    conveyance_loss: 0.1
    allocation: priority
    loss_return: river
    groundwater: true
  groundwater:
    connector: groundwater
    global_param: ${TORCHVIC_GLOBAL}
    interval_days: 1
    aquifer:
      k: 5.0
      sy: 0.1
      ss: 1.0e-05
      thickness: 100.0
      top: {file: '${TORCHVIC_DOMAIN}', var: elev}
      depth_to_water: 10.0
    drain: {depth: 3.0}
    pumping: true
    afr: 0.1
connections:
- {from: vic.soil_moisture, to: irrigation.soil_moisture}
- {from: vic.soil_add_unmet, to: irrigation.soil_unmet}
- {from: irrigation.soil_add, to: vic.soil_add, lag: 1}
- {from: vic.baseflow, to: groundwater.recharge}
- {from: irrigation.gw_request, to: groundwater.pumping_request}
- {from: groundwater.pumping, to: irrigation.gw_pumped, lag: 1}
ledger: {enabled: true, on_violation: reject}
output: {dir: results_vic_groundwater_irrigation, history: true, ledger: true}
