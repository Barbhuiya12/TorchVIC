site_name: TorchVIC
site_description: The VIC 5 land surface model in PyTorch, on GPU and CPU
site_author: Siddik Barbhuiya
site_url: https://barbhuiya12.github.io/TorchVIC/
repo_url: https://github.com/Barbhuiya12/TorchVIC
repo_name: Barbhuiya12/TorchVIC
edit_uri: edit/main/docs/
copyright: "Copyright &copy; 2026 Siddik Barbhuiya. TorchVIC is free software under GPL-3.0-or-later."
theme:
  name: readthedocs
  highlightjs: true
  navigation_depth: 4
  collapse_navigation: true
  sticky_navigation: true
  titles_only: false
extra_css:
  - css/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - fenced_code
  - def_list
nav:
  - Home: index.md
  - Documentation:
      - Install: install.md
      - Quick start: quickstart.md
      - Tutorials:
          - Walnut Gulch, end to end: tutorials/walnut-gulch.md
          - Your own domain, from scratch: tutorials/own-domain.md
      - Running VIC:
          - Guide overview: guide/index.md
          - Prepare your inputs: guide/inputs.md
          - The global file: guide/global-file.md
          - Run the model: guide/running.md
          - Outputs and state files: guide/outputs.md
          - Route runoff to gauges: guide/routing.md
          - Observations and ensembles: guide/study.md
          - Troubleshooting: troubleshooting.md
      - Coupled runs:
          - Overview: coupled/overview.md
          - Configuration file: CONFIGURATION.md
          - Connectors:
              - All connectors: connectors/index.md
              - VIC (connector API): CONNECTOR_API.md
              - River routing: connectors/river.md
              - Reservoirs: connectors/reservoir.md
              - Water quality: connectors/water_quality.md
              - Groundwater: connectors/groundwater.md
              - Flood: connectors/flood.md
              - Irrigation: connectors/irrigation.md
              - Crops (WOFOST): connectors/crop.md
              - CropSyst: connectors/cropsyst.md
              - VIC-WUR: connectors/vicwur.md
              - Ensembles and assimilation: connectors/ensemble_da.md
          - Coupling graph: COUPLING_GRAPH.md
          - Water accounting: WATER_ACCOUNTING.md
      - Reference:
          - Python API: guide/python-api.md
          - Options, value by value: OPTIONS.md
          - Output variables: OUTPUT_VARIABLES.md
          - Process-to-C mapping: mapping.md
      - Verification and performance:
          - Verification: verification.md
          - Performance: performance.md
          - Differences from VIC: differences.md
  - About:
      - Model overview: about/overview.md
      - Known limitations: about/limitations.md
      - Known issues in VIC 5: about/vic5-issues.md
      - FAQ: about/faq.md
      - How to cite: about/citing.md
      - References: about/references.md
      - Contact: about/contact.md
  - Development:
      - Release notes: development/release-notes.md
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - Architecture: ARCHITECTURE.md
  - Downloads:
      - Sample data: downloads/data.md
      - Code and license: downloads/code.md
exclude_docs: |
  _gen/
  requirements.txt
validation:
  links:
    anchors: warn
