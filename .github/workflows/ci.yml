name: ci

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch 2.6 and the package
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[test]
      - name: Tests that need no VIC tree and no sample data
        env:
          TORCHVIC_BUILD_ORACLES: "0"
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest -q -m "not reference and not slow and not gpu" tests
