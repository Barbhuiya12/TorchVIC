name: gpu-tests

# GPU tests on a schedule. This needs a SELF-HOSTED runner carrying the
# labels "self-hosted" and "gpu" (a machine with an NVIDIA GPU, CUDA driver
# and torch 2.6 CUDA wheels): GitHub's hosted runners have no GPU.
#
# DISABLED BY DEFAULT: with no such runner registered the job would queue
# forever, so the nightly schedule is commented out and the workflow runs
# only when started by hand (workflow_dispatch). To enable it, register the
# runner (Settings > Actions > Runners) and uncomment the schedule below.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * *"   # 03:00 UTC every night

jobs:
  gpu:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install torch 2.6 (CUDA) and the package
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install "torch==2.6.0"
          pip install -e .[test]
      - name: Report the device
        run: |
          . .venv/bin/activate
          python -c "import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))"
      - name: GPU tests
        run: |
          . .venv/bin/activate
          python -m pytest -q -m gpu tests
